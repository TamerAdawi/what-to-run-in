<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>What to Run In</title>
<meta name="description" content="What to wear for your run, from the forecast where you are.">
<meta name="theme-color" content="#c93d27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Run In">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column, phone first. Places → run settings → week chart → kit card → hourly lanes. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #111a24;
  --muted: #5b6776;
  --line: #d8dee6;
  --track: #c93d27;        /* running-track red: the one accent */
  --track-soft: #fbe5e0;
  --sun: #a85a00;
  --sun-soft: #fbecd8;
  --rain: #2b59ad;
  --rain-soft: #e1e8f6;
  --info-soft: #e9edf2;
  --good: #23784a;
  --good-soft: #dff1e6;
  --ice: #2c64a8;
  --dust: #7a5c2e;
  --dust-soft: #efe4d0;
  --zone-xcold: #b9cfeb;
  --zone-cold: #e0e9f5;
  --zone-hot: #fbe3c4;
  --zone-xhot: #f2b47a;
  --font-display: "Rubik", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Rubik", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141a; --surface: #171e26; --ink: #e8edf2; --muted: #94a0ae; --line: #28323d;
    --track: #ff6b4f; --track-soft: #3a1f1a; --sun: #f2a54f; --sun-soft: #382816;
    --rain: #88abee; --rain-soft: #1c2840; --info-soft: #1f2832;
    --good: #6fd09a; --good-soft: #17301f; --ice: #7fb0ee; --dust: #d9b77d; --dust-soft: #33291a;
    --zone-xcold: #2a4670; --zone-cold: #1c2a3c; --zone-hot: #3b2a15; --zone-xhot: #7a4a1c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --ink: #e8edf2; --muted: #94a0ae; --line: #28323d;
  --track: #ff6b4f; --track-soft: #3a1f1a; --sun: #f2a54f; --sun-soft: #382816;
  --rain: #88abee; --rain-soft: #1c2840; --info-soft: #1f2832;
  --good: #6fd09a; --good-soft: #17301f; --ice: #7fb0ee; --dust: #d9b77d; --dust-soft: #33291a;
  --zone-xcold: #2a4670; --zone-cold: #1c2a3c; --zone-hot: #3b2a15; --zone-xhot: #7a4a1c; color-scheme: dark;
}
:root[lang="he"] { --font-body: "Rubik", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(20px, env(safe-area-inset-top, 0px)) max(40px, env(safe-area-inset-bottom, 0px));
}
.wrap { max-width: 540px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--track); outline-offset: 2px; }

/* Header */
header.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
header.top > div { min-width: 0; }
h1 { font: 800 26px/1.1 var(--font-display); margin: 0; letter-spacing: -0.02em; font-style: italic; }
[dir="rtl"] h1 { font-style: normal; letter-spacing: 0; }
h1 span { color: var(--track); }
.now { color: var(--muted); font-size: 14px; }
.now b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.langbtn { font: 600 13px var(--font-display); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; flex: none; }

.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font: 500 13px var(--font-body); color: var(--muted); background: none; border: 0; padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

/* Panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
[dir="rtl"] .label { letter-spacing: 0; font-size: 12px; }
.head-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* Places */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 14px var(--font-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip svg { width: 14px; height: 14px; flex: none; }
.chip.on { background: var(--track); border-color: var(--track); color: var(--surface); }
.chip.saved { padding: 0; gap: 0; overflow: hidden; }
.chip.saved button { font: inherit; color: inherit; background: none; border: 0; padding-block: 6px; padding-inline: 12px 4px; cursor: pointer; }
.chip.saved button.x { padding-inline: 6px 10px; opacity: 0.6; font-size: 16px; line-height: 1; }
.chip.saved button.x:hover { opacity: 1; }
.chip.ghost { background: none; border-style: dashed; color: var(--muted); }
.saverow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.saverow b { color: var(--ink); font-weight: 600; }
.saverow input { flex: 1 1 140px; min-width: 0; }
input, select {
  font: 500 15px var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; width: 100%; min-width: 0;
  font-variant-numeric: tabular-nums;
}
input:disabled { opacity: 0.6; }
.btn { font: 600 13px var(--font-body); color: var(--track); background: var(--track-soft); border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.btn[aria-pressed="true"] { background: var(--track); color: var(--surface); }
.linkbtn { font: 500 13px var(--font-body); color: var(--track); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.results { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; }
.results li + li { border-top: 1px solid var(--line); }
.results button { width: 100%; text-align: start; background: none; border: 0; padding: 9px 4px; cursor: pointer; color: var(--ink); font: 500 14px var(--font-body); }
.results button span { color: var(--muted); font-weight: 400; }
.results .empty { padding: 9px 4px; color: var(--muted); font-size: 14px; }

/* Run settings */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.timerow { display: flex; gap: 6px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.learned { font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }

.status { font-size: 14px; color: var(--muted); padding: 2px; }
.status.err { color: var(--sun); }
.note { font-size: 13px; color: var(--sun); background: var(--sun-soft); border-radius: 8px; padding: 8px 10px; }

/* Kit card */
.kit { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--track); font-variant-numeric: tabular-nums; }
[dir="rtl"] .kicker { letter-spacing: 0; }
.kit h2 { font: 700 24px/1.15 var(--font-display); margin: 4px 0 0; text-wrap: balance; }
.temps { display: flex; gap: 18px; align-items: flex-end; }
.t { display: flex; flex-direction: column; }
.t b { font: 800 46px/1 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; direction: ltr; text-align: start; }
.t.end b { font-size: 28px; color: var(--muted); }
.t small { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.arrow { color: var(--muted); font: 500 20px var(--font-display); padding-bottom: 18px; }
.items { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.items li { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 500; }
.alerts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.alerts li { font-size: 14px; padding: 8px 10px; border-radius: 8px; background: var(--info-soft); }
.alerts li.hot { background: var(--sun-soft); }
.alerts li.wet { background: var(--rain-soft); }
.alerts li.dust { background: var(--dust-soft); }
.alerts li b { font-weight: 600; }
.sub { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.sub p { margin: 0; font-size: 14px; }
.sub .big { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; }
.fbnote { font-size: 13px; color: var(--muted); }
.meta { font-size: 13px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }

/* Week chart: one column per day, dot = feels-like at your start, bar = range during the run */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 1px solid transparent; border-radius: 10px; padding: 6px 2px; cursor: pointer; color: var(--ink); min-width: 0; }
.wd[aria-pressed="true"] { border-color: var(--track); background: var(--track-soft); }
.wd .dn { font-size: 12px; font-weight: 600; white-space: nowrap; }
.wd .dd { font-size: 11px; color: var(--muted); margin-top: -4px; font-variant-numeric: tabular-nums; }
.wd .track { position: relative; width: 22px; height: 96px; border-radius: 6px; border: 1px solid var(--line); overflow: hidden; }
.wd .rng { position: absolute; left: 50%; width: 4px; transform: translateX(-50%); background: var(--ink); opacity: 0.35; border-radius: 2px; }
.wd .dot { position: absolute; left: 50%; width: 12px; height: 12px; transform: translate(-50%, 50%); background: var(--ink); border: 2px solid var(--surface); border-radius: 50%; }
.wd .fv { font: 700 15px var(--font-display); font-variant-numeric: tabular-nums; }
.wd .vd { font-size: 10.5px; font-weight: 600; line-height: 1.2; text-align: center; border-radius: 6px; padding: 3px 4px; width: 100%; }
.wd .tip { font-size: 10px; color: var(--muted); text-align: center; line-height: 1.2; min-height: 12px; font-variant-numeric: tabular-nums; }
.v-good { background: var(--good-soft); color: var(--good); }
.v-hot { background: var(--zone-hot); color: var(--sun); }
.v-xhot { background: var(--zone-xhot); color: var(--ink); }
.v-cold { background: var(--zone-cold); color: var(--ice); }
.v-xcold { background: var(--zone-xcold); color: var(--ink); }
.v-wet { background: var(--rain-soft); color: var(--rain); }
.v-wind { background: var(--info-soft); color: var(--muted); }
.v-dusty { background: var(--dust-soft); color: var(--dust); }
.v-badair { background: var(--dust); color: var(--surface); }
.zones { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.zones span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; border: 1px solid var(--line); }
.zones .z-xcold::before { background: var(--zone-xcold); }
.zones .z-cold::before { background: var(--zone-cold); }
.zones .z-good::before { background: var(--surface); }
.zones .z-hot::before { background: var(--zone-hot); }
.zones .z-xhot::before { background: var(--zone-xhot); }

/* Hourly lanes (always left-to-right, like a clock) */
.strip-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; direction: ltr; }
.strip { display: flex; padding: 8px 6px; min-width: max-content; }
.hr { width: 44px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 8px; font-variant-numeric: tabular-nums; }
.hr .h { font-size: 11px; color: var(--muted); }
.hr .f { font: 600 15px var(--font-display); }
.hr .bar { width: 6px; height: 28px; background: var(--bg); border-radius: 3px; display: flex; align-items: flex-end; overflow: hidden; }
.hr .bar i { display: block; width: 100%; background: var(--rain); }
.hr .p { font-size: 10px; color: var(--muted); }
.hr.run { background: var(--track-soft); }
.hr.run .h { color: var(--track); font-weight: 600; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); flex-wrap: wrap; margin-top: 8px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-inline-end: 5px; vertical-align: -1px; }
.legend .l-run::before { background: var(--track-soft); border: 1px solid var(--track); }
.legend .l-rain::before { background: var(--rain); }
footer { font-size: 12px; color: var(--muted); }
footer a { color: var(--muted); }

@media (max-width: 420px) {
  .t b { font-size: 40px; }
  .grid { gap: 10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1><span data-i18n="title">What to Run In</span><span>.</span></h1>
      <div class="now" id="now">…</div>
    </div>
    <button class="langbtn" id="langBtn" type="button" lang="he">עברית</button>
  </header>

  <!-- Places -->
  <section class="panel">
    <div class="label" data-i18n="where">Where you're running</div>
    <div class="chips" id="places"></div>
    <div class="saverow" id="saveRow" hidden>
      <span><span data-i18n="savePre">Save</span> <b id="saveWhat"></b> <span data-i18n="saveAs">as</span></span>
      <input id="saveName" type="text" maxlength="24" data-i18n-ph="savePh">
      <button class="btn" id="saveBtn" type="button" data-i18n="savePlace">Save place</button>
    </div>
    <div id="searchPanel" hidden>
      <input id="q" type="search" autocomplete="off" data-i18n-ph="searchPh">
      <ul class="results" id="results"></ul>
    </div>
  </section>

  <!-- Run settings -->
  <section class="panel">
    <div class="grid">
      <div class="field">
        <label class="label" for="run" data-i18n="start">Start</label>
        <div class="timerow">
          <input type="time" id="run">
          <button class="btn" id="nowBtn" type="button" aria-pressed="false" data-i18n="now">Now</button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="dur" data-i18n="duration">Duration</label>
        <select id="dur"></select>
      </div>
    </div>
    <div class="row">
      <span class="label" data-i18n="runType">Run type</span>
      <div class="seg" role="group" id="typeSeg">
        <button data-type="zone2" type="button" data-i18n="zone2">Zone 2</button>
        <button data-type="tempo" type="button" data-i18n="tempo">Tempo</button>
        <button data-type="sprint" type="button" data-i18n="sprint">Sprints</button>
      </div>
    </div>
    <div class="row">
      <span class="label" data-i18n="feelCold">I feel the cold</span>
      <div class="seg" role="group" id="comfortSeg">
        <button data-c="-3" type="button" data-i18n="more">More</button>
        <button data-c="0" type="button" data-i18n="normal">Normal</button>
        <button data-c="3" type="button" data-i18n="less">Less</button>
      </div>
    </div>
    <div class="learned" id="learned" hidden></div>
  </section>

  <div id="note" class="note" hidden></div>
  <div id="status" class="status" hidden></div>

  <section class="panel" id="weekBox" hidden>
    <div class="head-row">
      <span class="label" id="weekTitle"></span>
      <span class="label" data-i18n="tapDay">Tap a day</span>
    </div>
    <div class="week" id="week"></div>
    <div class="zones" id="zones"></div>
  </section>

  <section class="kit" id="kit" hidden></section>

  <div id="stripBox" hidden>
    <div class="strip-wrap"><div class="strip" id="strip"></div></div>
    <div class="legend"><span class="l-run" data-i18n="lRun">Your run</span><span class="l-rain" data-i18n="lRain">Chance of rain</span><span data-i18n="lFeels">Feels-like °C per hour</span></div>
  </div>

  <footer><span data-i18n="footer">Feels-like temperatures in °C. Forecast, air quality and town search from</span> <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a>.</footer>
</div>

<script>
/* ================= Text (English / Hebrew) ================= */
const STR = {
  en: {
    title: "What to Run In", where: "Where you're running", myLoc: "My location", searchTown: "Search a town", closeSearch: "Close search",
    searchPh: "Search a town or city, e.g. Kfar Yona", savePre: "Save", saveAs: "as", savePh: "e.g. Home town", homeTown: "Home town",
    savePlace: "Save place", remove: n => `Remove ${n}`, start: "Start", now: "Now", nowTitle: "Use the current time", duration: "Duration",
    runType: "Run type", zone2: "Zone 2", tempo: "Tempo", sprint: "Sprints", feelCold: "I feel the cold", more: "More", normal: "Normal", less: "Less",
    tapDay: "Tap a day", lRun: "Your run", lRain: "Chance of rain", lFeels: "Feels-like °C per hour",
    footer: "Feels-like temperatures in °C. Forecast, air quality and town search from",
    weekTitle: (tm, d) => `This week · ${tm} · ${d}`, today: "Today", tomorrow: "Tomorrow", on: d => `on ${d}`,
    nowLine: (p, tp, f, w) => `${p} · now <b>${tp}°</b>, feels <b>${f}°</b> · ${w}`,
    dayLine: (p, d, lo, hi, w) => `${p} · ${d} <b>${lo}°–${hi}°</b> · ${w}`,
    feelsStart: "Feels at start", atFinish: "At finish", tryAt: tm => `Try ${tm}`, rainPct: p => `Rain ${p}%`,
    v: { good: "Good", hot: "Hot", xhot: "Too hot", cold: "Cold", xcold: "Too cold", wet: "Rainy", wind: "Windy", dusty: "Dusty", badair: "Bad air" },
    zXcold: n => `Too cold <${n}°`, zCold: n => `Cold <${n}°`, zGood: "Good", zHot: n => `Hot ${n}°+`, zXhot: n => `Too hot ${n}°+`,
    dayAria: (d, f, tm, v, alt) => `${d}: feels ${f}° at ${tm}, ${v}${alt ? ", better at " + alt : ""}`,
    wx: ["Clear", "Partly cloudy", "Cloudy", "Fog", "Drizzle", "Rain", "Snow", "Showers", "Thunderstorms"],
    meta: (a, w, p, h, x) => `Air ${a}° · wind ${w} km/h · rain ${p}% · humidity ${h}% · ${x}`,
    loading: "Loading forecast…", loadErr: "Couldn't load the forecast. Check your internet connection and try again.",
    offline: tm => `You're offline. Showing the forecast saved at ${tm}.`,
    finding: "Finding your location…", noGpsDefault: "Couldn't get your location, so this shows Tel Aviv. Search for your town and save it.",
    noGpsClick: "Couldn't get your location. Allow location access in your browser, or search for your town.",
    searching: "Searching…", noResults: "No places found. Try another spelling, or the Hebrew name.", searchErr: "Search isn't working right now. Check your connection.",
    near: c => `Near ${c}`, yourLoc: "Your location",
    durMin: d => `${d} min`, durH: (h, m) => `${h} h${m ? " " + m : ""}`,
    // alerts
    darkStartLight: sr => `<b>Dark at the start</b>, light by ${sr}. Wear something bright or reflective.`,
    stillDark: sr => `<b>Still dark</b> (sunrise ${sr}). Wear something bright or reflective, and a headlamp.`,
    darkAfter: ss => `<b>Dark</b> (sunset was ${ss}). Wear something bright or reflective, and a headlamp.`,
    darkBefore: ss => `<b>Gets dark before you finish</b> (sunset ${ss}). Wear something bright or reflective.`,
    warms: (f, tm) => `<b>Warms up to ${f}°</b> by ${tm}. Skip the extra layer, or pick one you can tie around your waist.`,
    cools: (f, tm) => `<b>Cools to ${f}°</b> by ${tm}. Take a light layer for the end of the run.`,
    rainLikely: p => `<b>Rain likely (${p}%).</b> A cap keeps it out of your eyes. Skip cotton, it stays wet.`,
    rainMaybe: p => `<b>Possible showers (${p}%).</b> A light shell if you have one.`,
    windy: (w, g) => `<b>Windy</b> (${w} km/h, gusts ${g}). A thin windbreaker helps on open stretches.`,
    hot: "<b>Hot for running.</b> Slow down and drink before and after.",
    coolest: (when, h, f) => ` Coolest time ${when}: ${h} (feels ${f}°).`,
    tooHotLong: d => ` Too hot for ${d}: cut it short or use the treadmill.`, tooHotShort: " Consider the treadmill or an easy pace.",
    humid: rh => `<b>Humid (${rh}%).</b> It'll feel warmer once you start.`,
    uv: u => `<b>UV ${u}.</b> Cap, sunglasses and sunscreen.`,

const PIN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

/* ================= State ================= */
const $ = s => document.querySelector(s);
const store = {
  get(k, d) { try { const v = localStorage.getItem("wtw:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("wtw:" + k, JSON.stringify(v)); } catch {} }
};
const navHe = (navigator.language || "").toLowerCase().startsWith("he");
const state = {
  lang: store.get("lang", navHe ? "he" : "en"),
  loc: store.get("loc", null),          // {name, lat, lon} | {gps:true, near, lat, lon} | {city, lat, lon}
  places: store.get("places", []),      // saved: [{name, place, lat, lon}]
  run: store.get("run", "06:30"),
  runNow: store.get("runNow", false),
  dur: store.get("dur", 45),
  type: ["zone2", "tempo", "sprint"].includes(store.get("type", "")) ? store.get("type", "") : "zone2",
  comfort: store.get("comfort", 0),
  votes: store.get("votes", {}),        // {"2026-11-20": "cold" | "ok" | "hot"}
  day: 0,
  data: null
};

/* ================= Helpers ================= */
const t = (k, ...a) => { const v = STR[state.lang][k] ?? STR.en[k]; return typeof v === "function" ? v(...a) : v; };
const pad = n => String(n).padStart(2, "0");
const r = n => Math.round(n);
const r50 = n => Math.round(n / 50) * 50;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hm = s => { const [h, m] = s.split(":").map(Number); return { h, m, min: h * 60 + m }; };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const timeFor = i => i === 0 && state.runNow ? nowHM() : state.run;      // "Now" only applies to today
const runTime = () => timeFor(state.day);
const fmtDur = d => d < 60 ? t("durMin", d) : t("durH", Math.floor(d / 60), d % 60);
const wxIdx = c => c === 0 ? 0 : c <= 2 ? 1 : c === 3 ? 2 : c <= 48 ? 3 : c <= 57 ? 4 : c <= 67 ? 5 : c <= 77 ? 6 : c <= 82 ? 7 : 8;
const wx = c => t("wx")[wxIdx(c)];
const locale = () => state.lang === "he" ? "he-IL" : "en-GB";
const dayDate = i => new Date(state.data.days[i].date + "T12:00:00");
const dayName = i => i === 0 ? t("today") : i === 1 ? t("tomorrow") : dayDate(i).toLocaleDateString(locale(), { weekday: "long" });
const dayShort = i => i === 0 ? t("today") : dayDate(i).toLocaleDateString(locale(), { weekday: "short" });
const cityName = i => CITIES[i][state.lang === "he" ? 1 : 0];
const sameLoc = (a, b) => !!a && !!b && Math.abs(a.lat - b.lat) < 0.01 && Math.abs(a.lon - b.lon) < 0.01;
const savedMatch = () => state.places.find(p => sameLoc(p, state.loc));
function locName(l) {
  if (l.gps) return l.near >= 0 ? t("near", cityName(l.near)) : t("yourLoc");
  if (l.city != null) return cityName(l.city);
  return l.name;
}
const placeName = () => { const s = savedMatch(); return s && !state.loc.gps ? s.name : locName(state.loc); };
function nearestCity(lat, lon) {
  let best = -1, bd = Infinity;
  CITIES.forEach(([, , a, b], i) => { const d = (a - lat) ** 2 + ((b - lon) * 0.85) ** 2; if (d < bd) { bd = d; best = i; } });
  return bd < 0.5 ? best : -1;
}

/* ================= Personal adjustment ================= */
// Feedback votes: each "too cold" dresses you 1° warmer, each "too hot" 1° lighter (max ±6).
function learned() {
  const vals = Object.values(state.votes);
  const sum = vals.reduce((s, v) => s + (v === "cold" ? -1 : v === "hot" ? 1 : 0), 0);
  return { n: vals.length, off: Math.max(-6, Math.min(6, sum)) };
}
const offset = () => state.comfort + learned().off;
// Feels-like limits for the week chart, in raw feels-like °C. Hard efforts (tempo, sprints) feel hotter.
const hard = () => state.type === "tempo" || state.type === "sprint";
function limits() {
  const off = offset(), th = hard() ? 2 : 0;
  return { xcold: 5 - off, cold: 10 - off, hot: 27 - off - th, xhot: 32 - off - th };
}

/* ================= Kit rules (feels-like °C at the start, tuned for Israel) ================= */
function runKit(f) {
  const i = f >= 30 ? 0 : f >= 24 ? 1 : f >= 19 ? 2 : f >= 15 ? 3 : f >= 11 ? 4 : f >= 7 ? 5 : 6;
  const [head, items] = t("kit")[i];
  return { head, items };
}

/* ================= Forecast + air quality ================= */
let loadSeq = 0;
async function load() {
  const seq = ++loadSeq;
  const { lat, lon } = state.loc;
  showStatus(t("loading"));
  const ll = "latitude=" + lat + "&longitude=" + lon;
  const fUrl = "https://api.open-meteo.com/v1/forecast?" + ll +
    "&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation_probability,weather_code,wind_speed_10m,wind_gusts_10m,uv_index" +
    "&daily=sunrise,sunset,temperature_2m_max,temperature_2m_min&current=temperature_2m,apparent_temperature,weather_code&timezone=auto&forecast_days=7";
  const aUrl = "https://air-quality-api.open-meteo.com/v1/air-quality?" + ll + "&hourly=pm10,us_aqi&timezone=auto&forecast_days=7";
  const [fr, ar] = await Promise.allSettled([
    fetch(fUrl).then(x => { if (!x.ok) throw new Error(x.status); return x.json(); }),
    fetch(aUrl).then(x => { if (!x.ok) throw new Error(x.status); return x.json(); })
  ]);
  if (seq !== loadSeq) return;          // a newer place was picked meanwhile
  if (fr.status === "fulfilled") {
    const aq = ar.status === "fulfilled" ? ar.value : null;
    store.set("lastfc", { lat, lon, j: fr.value, aq, at: Date.now() });
    state.data = shape(fr.value, aq);
    showStatus(null);
  } else {
    const last = store.get("lastfc", null);
    if (last && sameLoc(last, state.loc)) {
      state.data = shape(last.j, last.aq);
      const d = new Date(last.at);
      showStatus(t("offline", d.toLocaleString(locale(), { weekday: "short", hour: "2-digit", minute: "2-digit" })), true);
    } else { showStatus(t("loadErr"), true); return; }
  }
  // If the saved forecast starts on an earlier day, drop the past days
  const todayStr = new Date().toLocaleDateString("en-CA");
  while (state.data.days.length > 1 && state.data.days[0].date < todayStr) state.data.days.shift();
  state.day = Math.min(state.day, state.data.days.length - 1);
  render();
}

function shape(j, aq) {
  const H = j.hourly;
  const air = {};
  if (aq && aq.hourly) aq.hourly.time.forEach((tm, k) => { air[tm] = { pm: aq.hourly.pm10[k], aqi: aq.hourly.us_aqi[k] }; });
  const days = j.daily.time.map((date, i) => {
    const hours = [];
    H.time.forEach((tm, k) => {
      if (!tm.startsWith(date)) return;
      const a = air[tm] || {};
      hours[+tm.slice(11, 13)] = {
        t: H.temperature_2m[k], f: H.apparent_temperature[k], rh: H.relative_humidity_2m[k],
        pp: H.precipitation_probability[k] ?? 0, code: H.weather_code[k],
        ws: H.wind_speed_10m[k], wg: H.wind_gusts_10m[k], uv: H.uv_index[k] ?? 0,
        pm: a.pm ?? null, aqi: a.aqi ?? null
      };
    });
    for (let h = 0; h < 24; h++) if (!hours[h]) hours[h] = hours[h - 1] || hours.find(Boolean);
    return { date, hours, sunrise: j.daily.sunrise[i].slice(11, 16), sunset: j.daily.sunset[i].slice(11, 16),
      tmin: j.daily.temperature_2m_min[i], tmax: j.daily.temperature_2m_max[i] };
  });
  return { days, current: j.current };
}

const at = (hours, h, m, k) => { const a = hours[h][k], b = hours[Math.min(h + 1, 23)][k]; return a + (b - a) * m / 60; };

// Weather over the run: start → start + duration (capped at midnight)
function windowStats(day, timeStr) {
  const tt = hm(timeStr);
  const endMin = Math.min(tt.min + state.dur, 23 * 60 + 59);
  const eH = Math.floor(endMin / 60), eM = endMin % 60;
  const hrs = [];
  for (let h = tt.h; h <= eH; h++) hrs.push(day.hours[h]);
  const f = at(day.hours, tt.h, tt.m, "f");
  const fEnd = at(day.hours, eH, eM, "f");
  const fs = [f, fEnd, ...hrs.map(x => x.f)];
  const pms = hrs.map(x => x.pm).filter(v => v != null), aqis = hrs.map(x => x.aqi).filter(v => v != null);
  const pm = pms.length ? Math.max(...pms) : null, aqi = aqis.length ? Math.max(...aqis) : null;
  return {
    t: tt, endMin, eH, endStr: pad(eH) + ":" + pad(eM), hrs, f, fEnd,
    fMax: Math.max(...fs), fMin: Math.min(...fs), air: at(day.hours, tt.h, tt.m, "t"),
    pp: Math.max(...hrs.map(x => x.pp)), wind: Math.max(...hrs.map(x => x.ws)),
    gust: Math.max(...hrs.map(x => x.wg)), uv: Math.max(...hrs.map(x => x.uv)), rh: hrs[0].rh,
    pm, aqi,
    aqBad: (pm ?? 0) >= 250 || (aqi ?? 0) >= 151,
    aqMod: (pm ?? 0) >= 100 || (aqi ?? 0) >= 101
  };
}

/* ================= Week verdicts ================= */
function verdict(w) {
  const L = limits();
  if (w.aqBad) return "badair";
  if (w.fMax >= L.xhot) return "xhot";
  if (w.fMin < L.xcold) return "xcold";
  if (w.aqMod) return "dusty";
  if (w.fMax >= L.hot) return "hot";
  if (w.fMin < L.cold) return "cold";
  if (w.pp >= 60) return "wet";
  if (w.gust >= 50) return "wind";
  return "good";
}
// On a hot or cold day, find a start time that's clearly better (3°+)
function betterTime(i, w, key) {
  const day = state.data.days[i];
  const hot = key === "xhot" || key === "hot";
  const from = i === 0 ? Math.max(hot ? 5 : 6, new Date().getHours() + 1) : (hot ? 5 : 6);
  const to = hot ? 21 : 17;
  let best = null;
  for (let h = from; h <= to; h++) {
    const s = windowStats(day, pad(h) + ":00");
    const score = hot ? s.fMax : -s.fMin;
    if (!best || score < best.score) best = { h, score };
  }
  if (!best) return null;
  const gain = hot ? w.fMax - best.score : -best.score - w.fMin;
  return gain >= 3 ? pad(best.h) + ":00" : null;
}

/* ================= Water ================= */
// Rough sweat rate (ml/hour) from the warmest part of the run, humidity and effort
function water(w) {
  const f = w.fMax;
  let rate = f < 10 ? 350 : f < 15 ? 450 : f < 20 ? 550 : f < 25 ? 700 : f < 30 ? 850 : 1000;
  if (w.rh >= 70 && f >= 20) rate += 100;
  if (state.type === "tempo") rate += 150;
  if (state.type === "sprint") rate += 100;
  const loss = Math.max(100, r50(rate * state.dur / 60));
  const carry = state.dur >= 60 || (state.dur >= 45 && f >= 26);
  return { loss, carry, carryMl: Math.max(250, r50(loss * 0.6)), salt: loss >= 1200 };
}

/* ================= Run analysis ================= */
function analyzeRun(day) {
  const w = windowStats(day, runTime());
  const { t: tt, endMin, endStr, f, fEnd, fMax, air, pp, wind, gust, uv, rh } = w;
  const L = limits();
  const eff = f + offset() + (hard() ? 3 : 0);   // dress for the start; hard efforts one step lighter
  const kit = runKit(eff);
  const sr = hm(day.sunrise).min, ss = hm(day.sunset).min;
  const A = [];

  if (tt.min < sr) A.push(["", endMin > sr + 15 ? t("darkStartLight", day.sunrise) : t("stillDark", day.sunrise)]);
  else if (tt.min >= ss) A.push(["", t("darkAfter", day.sunset)]);
  else if (endMin > ss) A.push(["", t("darkBefore", day.sunset)]);

  if (w.aqBad) A.push(["dust", t("dustBad", r(w.pm ?? 0))]);
  else if (w.aqMod) A.push(["dust", t("dustMod", r(w.pm ?? 0))]);

  if (fEnd - f >= 4) A.push(["hot", t("warms", r(fEnd), endStr)]);
  else if (f - fEnd >= 4) A.push(["", t("cools", r(fEnd), endStr)]);

  if (pp >= 50) A.push(["wet", t("rainLikely", pp)]);
  else if (pp >= 30) A.push(["wet", t("rainMaybe", pp)]);

  if (wind >= 25 || gust >= 40) A.push(["", t("windy", r(wind), r(gust))]);

  if (fMax >= L.hot) {
    const startH = state.day === 0 ? Math.max(5, new Date().getHours() + 1) : 5;
    let best = null;
    for (let h = startH; h <= 21; h++) if (!best || day.hours[h].f < best.f) best = { h, f: day.hours[h].f };
    let msg = t("hot");
    const when = state.day === 0 ? t("today").toLowerCase() : state.day === 1 ? t("tomorrow").toLowerCase() : t("on", dayName(state.day));
    if (best && best.f < f - 2) msg += t("coolest", when, pad(best.h) + ":00", r(best.f));
    if (fMax >= L.xhot) msg += state.dur > 45 ? t("tooHotLong", fmtDur(state.dur)) : t("tooHotShort");
    A.push(["hot", msg]);
    if (state.type === "tempo") A.push(["hot", t("tempoHeat")]);
    if (state.type === "sprint") A.push(["hot", t("sprintHeat")]);
  } else if (fMax >= L.hot - 5 && rh >= 70) {
    A.push(["hot", t("humid", rh)]);
  }
  if (state.type === "tempo" && eff - 3 >= 11 && eff - 3 < 24) A.push(["", t("tempoKit")]);
  if (state.type === "sprint" && eff - 3 < 24) A.push(["", t("sprintKit")]);
  if (state.type === "sprint" && eff - 3 < 15) A.push(["", t("sprintWarm")]);
  if (state.dur >= 75) A.push(["", t("longFuel")]);
  if (uv >= 6 && endMin > sr && tt.min < ss) A.push(["hot", t("uv", r(uv))]);
  if (eff < 15) A.push(["", state.dur <= 30 ? t("warmShort") : t("warm10")]);

  return { kit, f, fEnd, air, alerts: A, w, startStr: runTime(), endStr, startH: tt.h, endH: w.eH,
    meta: t("meta", r(air), r(wind), pp, rh, wx(w.hrs[0].code).toLowerCase()) };
}

/* ================= Render ================= */
function applyStatic() {
  const he = state.lang === "he";
  document.documentElement.lang = state.lang;
  document.documentElement.dir = he ? "rtl" : "ltr";
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  $("#nowBtn").title = t("nowTitle");
  $("#typeSeg").setAttribute("aria-label", t("runType"));
  $("#comfortSeg").setAttribute("aria-label", t("feelCold"));
  const lb = $("#langBtn");
  lb.textContent = he ? "English" : "עברית";
  lb.lang = he ? "en" : "he";
  $("#dur").innerHTML = DURS.map(d => `<option value="${d}">${fmtDur(d)}</option>`).join("");
  $("#dur").value = String(state.dur);
}

function render() {
  renderPlaces();
  $("#nowBtn").setAttribute("aria-pressed", state.runNow);
  $("#run").disabled = state.runNow;
  $("#run").value = runTime();
  document.querySelectorAll("[data-c]").forEach(b => b.setAttribute("aria-pressed", +b.dataset.c === state.comfort));
  document.querySelectorAll("[data-type]").forEach(b => b.setAttribute("aria-pressed", b.dataset.type === state.type));
  renderLearned();
  if (!state.data) return;

  const day = state.data.days[state.day];
  const c = state.data.current;
  $("#now").innerHTML = state.day === 0
    ? t("nowLine", esc(placeName()), r(c.temperature_2m), r(c.apparent_temperature), wx(c.weather_code))
    : t("dayLine", esc(placeName()), dayName(state.day), r(day.tmin), r(day.tmax), wx(day.hours[13].code));

  renderWeek();
  renderKit(day);

  let html = "";
  const run = analyzeRun(day);
  for (let h = Math.min(5, run.startH); h <= 23; h++) {
    const x = day.hours[h];
    const cls = h >= run.startH && h <= run.endH ? "run" : "";
    html += `<div class="hr ${cls}" title="${pad(h)}:00 · ${wx(x.code)}"><span class="h">${pad(h)}</span><span class="f">${r(x.f)}°</span><span class="bar"><i style="height:${x.pp}%"></i></span><span class="p">${x.pp}%</span></div>`;
  }
  $("#strip").innerHTML = html;
  $("#stripBox").hidden = false;
}

function renderKit(day) {
  const run = analyzeRun(day);
  const wt = water(run.w);
  const label = state.day === 0 && state.runNow ? t("now") : dayName(state.day);
  const typeTxt = " · " + t(state.type);
  const arrow = state.lang === "he" ? "←" : "→";
  let fb = "";
  if (state.day === 0) {
    const vote = state.votes[day.date];
    const btn = (v, k) => `<button type="button" data-vote="${v}" aria-pressed="${vote === v}">${t(k)}</button>`;
    fb = `<div class="sub">
      <span class="label">${t("fbTitle")}</span>
      <div><div class="seg" role="group" aria-label="${t("fbTitle")}">${btn("cold", "fbCold")}${btn("ok", "fbOk")}${btn("hot", "fbHot")}</div></div>
      <p class="fbnote">${vote ? t("fbSaved") : t("fbHint")}</p>
    </div>`;
  }
  $("#kit").innerHTML = `
    <div>
      <div class="kicker">${label} · <span dir="ltr">${run.startStr}–${run.endStr}</span> · ${fmtDur(state.dur)}${typeTxt}</div>
      <h2>${run.kit.head}</h2>
    </div>
    <div class="temps">
      <div class="t"><b>${r(run.f)}°</b><small>${t("feelsStart")}</small></div>
      <div class="arrow" aria-hidden="true">${arrow}</div>
      <div class="t end"><b>${r(run.fEnd)}°</b><small>${t("atFinish")}</small></div>
    </div>
    <ul class="items">${run.kit.items.map(i => `<li>${i}</li>`).join("")}</ul>
    ${run.alerts.length ? `<ul class="alerts">${run.alerts.map(([k, x]) => `<li class="${k}">${x}</li>`).join("")}</ul>` : ""}
    <div class="sub">
      <span class="label">${t("water")}</span>
      <span class="big">${t("sweat", wt.loss)}</span>
      <p>${wt.carry ? t("carry", wt.carryMl, "400–500") : t("noCarry")}${wt.salt ? " " + t("salt") : ""}</p>
    </div>
    ${fb}
    <p class="meta">${run.meta}</p>`;
  $("#kit").hidden = false;
}

function renderWeek() {
  const L = limits();
  const scale = v => Math.max(0, Math.min(100, v / 40 * 100));   // track runs 0–40 °C feels-like
  const s = [L.xcold, L.cold, L.hot, L.xhot].map(scale);
  const grad = `linear-gradient(to top, var(--zone-xcold) 0 ${s[0]}%, var(--zone-cold) ${s[0]}% ${s[1]}%, var(--surface) ${s[1]}% ${s[2]}%, var(--zone-hot) ${s[2]}% ${s[3]}%, var(--zone-xhot) ${s[3]}% 100%)`;

  $("#week").innerHTML = state.data.days.map((day, i) => {
    const w = windowStats(day, timeFor(i));
    const v = verdict(w);
    const alt = ["xhot", "hot", "xcold", "cold"].includes(v) ? betterTime(i, w, v) : null;
    const lo = scale(w.fMin), hi = scale(w.fMax);
    const vl = t("v")[v];
    return `<button class="wd" type="button" data-d="${i}" aria-pressed="${i === state.day}" aria-label="${esc(t("dayAria", dayName(i), r(w.f), timeFor(i), vl, alt))}">
      <span class="dn">${dayShort(i)}</span><span class="dd">${dayDate(i).getDate()}</span>
      <span class="track" style="background:${grad}" aria-hidden="true">
        <i class="rng" style="bottom:${lo}%;height:${Math.max(hi - lo, 0)}%"></i>
        <i class="dot" style="bottom:${scale(w.f)}%"></i>
      </span>
      <span class="fv">${r(w.f)}°</span>
      <span class="vd v-${v}">${vl}</span>
      <span class="tip" dir="ltr">${alt ? t("tryAt", alt) : w.pp >= 30 ? t("rainPct", w.pp) : ""}</span>
    </button>`;
  }).join("");

  $("#zones").innerHTML = `<span class="z-xcold">${esc(t("zXcold", r(L.xcold)))}</span><span class="z-cold">${esc(t("zCold", r(L.cold)))}</span>` +
    `<span class="z-good">${t("zGood")}</span><span class="z-hot">${esc(t("zHot", r(L.hot)))}</span><span class="z-xhot">${esc(t("zXhot", r(L.xhot)))}</span>`;
  $("#weekTitle").textContent = t("weekTitle", state.runNow ? t("now") + " / " + state.run : state.run, fmtDur(state.dur));
  $("#weekBox").hidden = false;
}

function renderLearned() {
  const { n, off } = learned();
  const box = $("#learned");
  box.hidden = n === 0;
  if (!n) return;
  const d = off < 0 ? t("lWarmer", -off) : off > 0 ? t("lLighter", off) : t("lSame");
  box.innerHTML = `<span>${t("learned", n, d)}</span><button class="linkbtn" type="button" id="resetLearn">${t("reset")}</button>`;
}

function renderPlaces() {
  const onGps = !!(state.loc && state.loc.gps);
  let html = `<button class="chip ${onGps ? "on" : ""}" type="button" data-act="gps">${PIN}${t("myLoc")}</button>`;
  state.places.forEach((p, i) => {
    const on = !onGps && sameLoc(p, state.loc);
    html += `<span class="chip saved ${on ? "on" : ""}"><button type="button" data-p="${i}" title="${esc(p.place)}">${esc(p.name)}</button><button type="button" class="x" data-del="${i}" aria-label="${esc(t("remove", p.name))}">×</button></span>`;
  });
  if (state.loc && !onGps && !savedMatch()) html += `<span class="chip on">${esc(locName(state.loc))}</span>`;
  const open = !$("#searchPanel").hidden;
  html += `<button class="chip ghost" type="button" data-act="search" aria-expanded="${open}">${open ? t("closeSearch") : t("searchTown")}</button>`;
  $("#places").innerHTML = html;

  const canSave = state.loc && !savedMatch();
  $("#saveRow").hidden = !canSave;
  if (canSave) {
    $("#saveWhat").textContent = locName(state.loc);
    if (!$("#saveName").dataset.touched) $("#saveName").value = state.places.length ? "" : t("homeTown");
  }
}

function showStatus(msg, err) { const s = $("#status"); s.hidden = !msg; s.textContent = msg || ""; s.classList.toggle("err", !!err); }
function showNote(msg) { const n = $("#note"); n.hidden = !msg; n.textContent = msg || ""; }

/* ================= Location ================= */
function setLoc(loc) { state.loc = loc; store.set("loc", loc); showNote(null); render(); load(); }

function locate(fromClick) {
  if (!navigator.geolocation) return noGps(fromClick);
  showStatus(t("finding"));
  navigator.geolocation.getCurrentPosition(p => {
    const lat = +p.coords.latitude.toFixed(3), lon = +p.coords.longitude.toFixed(3);
    setLoc({ gps: true, near: nearestCity(lat, lon), lat, lon });
  }, () => noGps(fromClick), { timeout: 8000, maximumAge: 30 * 60 * 1000 });
}
function noGps(fromClick) {
  showStatus(null);
  if (!state.loc) {
    state.loc = { city: 0, lat: CITIES[0][2], lon: CITIES[0][3] };
    showNote(t("noGpsDefault"));
    render(); load();
  } else if (fromClick) showNote(t("noGpsClick"));
}

// Town search (Open-Meteo geocoding: small towns and villages too, English or Hebrew)
let searchTimer = null, searchSeq = 0;
async function search(q) {
  const seq = ++searchSeq;
  const list = $("#results");
  if (q.trim().length < 2) { list.innerHTML = ""; return; }
  list.innerHTML = `<li class="empty">${t("searching")}</li>`;
  try {
    const res = await fetch("https://geocoding-api.open-meteo.com/v1/search?count=8&format=json&language=" + state.lang + "&name=" + encodeURIComponent(q.trim()));
    const j = await res.json();
    if (seq !== searchSeq) return;
    const found = (j.results || []).sort((a, b) => (b.country_code === "IL") - (a.country_code === "IL"));
    list.innerHTML = found.length
      ? found.map((p, i) => `<li><button type="button" data-r="${i}">${esc(p.name)} <span>${esc([p.admin1, p.country].filter(Boolean).join(", "))}</span></button></li>`).join("")
      : `<li class="empty">${t("noResults")}</li>`;
    list.onclick = e => {
      const b = e.target.closest("[data-r]"); if (!b) return;
      const p = found[+b.dataset.r];
      closeSearch();
      setLoc({ name: p.name, lat: +p.latitude.toFixed(3), lon: +p.longitude.toFixed(3) });
    };
  } catch {
    if (seq === searchSeq) list.innerHTML = `<li class="empty">${t("searchErr")}</li>`;
  }
}
function closeSearch() { $("#searchPanel").hidden = true; $("#q").value = ""; $("#results").innerHTML = ""; }

/* ================= Wire up ================= */
$("#places").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.act === "gps") return locate(true);
  if (b.dataset.act === "search") {
    const panel = $("#searchPanel");
    if (panel.hidden) { panel.hidden = false; renderPlaces(); $("#q").focus(); } else { closeSearch(); renderPlaces(); }
    return;
  }
  if (b.dataset.del != null) { state.places.splice(+b.dataset.del, 1); store.set("places", state.places); render(); return; }
  if (b.dataset.p != null) { const p = state.places[+b.dataset.p]; setLoc({ name: p.place, lat: p.lat, lon: p.lon }); }
});
$("#saveName").addEventListener("input", e => { e.target.dataset.touched = "1"; });
function savePlace() {
  if (!state.loc || savedMatch()) return;
  const place = locName(state.loc);
  const name = $("#saveName").value.trim() || place;
  state.places.push({ name, place, lat: state.loc.lat, lon: state.loc.lon });
  store.set("places", state.places);
  if (state.loc.gps) { state.loc = { name: place, lat: state.loc.lat, lon: state.loc.lon }; store.set("loc", state.loc); }
  $("#saveName").value = ""; delete $("#saveName").dataset.touched;
  render();
}
$("#saveBtn").onclick = savePlace;
$("#saveName").addEventListener("keydown", e => { if (e.key === "Enter") savePlace(); });
$("#q").addEventListener("input", e => { clearTimeout(searchTimer); searchTimer = setTimeout(() => search(e.target.value), 350); });
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") { closeSearch(); renderPlaces(); } });

const runIn = $("#run");
runIn.addEventListener("change", () => { if (!runIn.value) return; state.run = runIn.value; store.set("run", runIn.value); render(); });
$("#nowBtn").onclick = () => { state.runNow = !state.runNow; store.set("runNow", state.runNow); if (state.runNow) state.day = 0; render(); };
$("#dur").addEventListener("change", e => { state.dur = +e.target.value; store.set("dur", state.dur); render(); });
$("#typeSeg").addEventListener("click", e => { const b = e.target.closest("[data-type]"); if (!b) return; state.type = b.dataset.type; store.set("type", state.type); render(); });
$("#comfortSeg").addEventListener("click", e => { const b = e.target.closest("[data-c]"); if (!b) return; state.comfort = +b.dataset.c; store.set("comfort", state.comfort); render(); });
$("#learned").addEventListener("click", e => { if (e.target.id === "resetLearn") { state.votes = {}; store.set("votes", {}); render(); } });
$("#kit").addEventListener("click", e => {
  const b = e.target.closest("[data-vote]"); if (!b || !state.data) return;
  const date = state.data.days[0].date;
  if (state.votes[date] === b.dataset.vote) delete state.votes[date]; else state.votes[date] = b.dataset.vote;
  store.set("votes", state.votes); render();
});
// Tap a day in the week chart to see its kit. "Now" only makes sense today.
$("#week").addEventListener("click", e => {
  const b = e.target.closest("[data-d]"); if (!b) return;
  state.day = +b.dataset.d;
  if (state.day !== 0 && state.runNow) { state.runNow = false; store.set("runNow", false); }
  render();
});
$("#langBtn").onclick = () => { state.lang = state.lang === "he" ? "en" : "he"; store.set("lang", state.lang); applyStatic(); render(); };
setInterval(() => { if (state.runNow && state.data) render(); }, 60 * 1000);
// Coming back to the app (e.g. from the home screen) refreshes an old forecast
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && state.loc) { const last = store.get("lastfc", null); if (!last || Date.now() - last.at > 30 * 60 * 1000) load(); }
});

// Older saves stored GPS places with a fixed English name
if (state.loc && state.loc.gps && state.loc.near == null) state.loc = { ...state.loc, near: nearestCity(state.loc.lat, state.loc.lon) };
// Start: last place used → first saved place → GPS
if (!state.loc && state.places.length) { const p = state.places[0]; state.loc = { name: p.place, lat: p.lat, lon: p.lon }; }
state.day = !state.runNow && new Date().getHours() >= 20 ? 1 : 0;
applyStatic();
render();
if (state.loc) load(); else locate(false);

// Installable app: works offline with the last forecast
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
